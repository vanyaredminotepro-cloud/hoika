[build]
builder = "NIXPACKS"

[services.bot]
build = { dockerfile = "Dockerfile" }
command = ["python", "-m", "app.warlord.main"]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.web]
build = { dockerfile = "Dockerfile" }
command = ["python", "-m", "app.webapp"]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.dockerfileVolume]]
path = "/app/warlord_data"
